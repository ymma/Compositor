name: Build macOS 14 DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Archive the macOS 14 app
        run: >
          xcodebuild archive
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -archivePath "$RUNNER_TEMP/Compositor.xcarchive"
          -destination 'generic/platform=macOS'
          MACOSX_DEPLOYMENT_TARGET=14.0
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Create DMG
        run: |
          app="$RUNNER_TEMP/Compositor.xcarchive/Products/Applications/Compositor.app"
          test -d "$app"
          staging="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$staging"
          ditto "$app" "$staging/Compositor.app"
          hdiutil create \
            -volname "Compositor for macOS 14" \
            -srcfolder "$staging" \
            -format UDZO \
            -ov "$RUNNER_TEMP/Compositor-macos14-arm64.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-macos14-arm64
          path: ${{ runner.temp }}/Compositor-macos14-arm64.dmg
          if-no-files-found: error
          retention-days: 30
